[experiment]
name = "avsa_internal_overhead"
description = "Per-stage AVSA runtime and size overhead using the real Bulletproofs backend."
backend = "bulletproofs"
cargo_features = "bulletproofs"
paper_level = true
output_root = "results/avsa_internal"

[defaults]
n_selected = 8
n_admitted = 7
n_dropped = 1
n_rejected = 0
dim = 64
b_inf = 3
b2_sq = 576
bit_size = 16
iters = 5
warmup = 1
seed = 42

[measured_operations]
runtime = [
  "round_generation",
  "commit_vector",
  "mask_tag_generation",
  "submit_prove",
  "submit_verify",
  "signed_range_prove",
  "signed_range_verify",
  "l2_prove",
  "l2_verify",
  "transcript_root_build",
  "membership_verify",
  "receipt_verify",
  "verify_accepted_decision",
  "verify_appeal",
  "verify_mask_certificate",
  "verify_aggregate_certificate",
  "honest_full_audit_pipeline",
]
sizes = [
  "ClientRecord",
  "SubmitProof",
  "SignedRangeProof",
  "L2Proof",
  "RecordDigest",
  "TranscriptRoot",
  "Transcript",
  "MembershipProof",
  "Receipt",
  "DecisionCertificate",
  "AppealInput",
  "MaskCertificate",
  "AggregateCertificate",
  "AggregateOutput",
]

[[cases]]
name = "internal_smoke_bp"
dim = 8
n_selected = 4
n_admitted = 3
n_dropped = 1
b2_sq = 72
bit_size = 8
iters = 3
warmup = 1
out = "results/avsa_internal/smoke_bp"

[[cases]]
name = "internal_small_bp"
dim = 64
n_selected = 8
n_admitted = 7
n_dropped = 1
b2_sq = 576
bit_size = 16
iters = 5
warmup = 1
out = "results/avsa_internal/small_bp"
