[package]
name = "avsa-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "avsa_rs"
path = "src/lib.rs"

[dependencies]
bulletproofs = { version = "5.0.0", optional = true, features = ["rand"] }
curve25519-dalek = "4"
merlin = { version = "3", optional = true }
rand = "0.8"
sha2 = "0.10"
thiserror = "1"

[features]
default = []
bulletproofs-backend = ["dep:bulletproofs", "dep:merlin"]
bulletproofs = ["bulletproofs-backend"]

[dev-dependencies]
rand_chacha = "0.3"
