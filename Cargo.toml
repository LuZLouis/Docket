[package]
name = "docket-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "docket_rs"
path = "src/lib.rs"

[dependencies]
bulletproofs = { version = "5.0.0", features = ["rand"] }
curve25519-dalek = { version = "4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hpke = { version = "0.11", features = ["x25519"] }
fs2 = "0.4"
merlin = "3"
rand = "0.8"
sha2 = "0.10"
